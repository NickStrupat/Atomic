name: Release

# Push a tag such as v0.1.0 to publish that version. Publishes through nuget.org Trusted Publishing, which needs a
# policy on nuget.org for owner NickStrupat, repository Atomic, workflow file release.yml.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets NuGet/login exchange GitHub's OIDC token for a short-lived API key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The tag is the version, so the package, the assembly and the tag cannot disagree.
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build -c Release -p:Version=$VERSION
      - run: dotnet test -c Release --no-build
      - run: dotnet run --project CoyoteTests -c Release --no-build
      - run: dotnet pack Atomic -c Release --no-build -o artifacts -p:Version=$VERSION
      # The key lasts an hour, so request it only once the package is built.
      - uses: NuGet/login@v1
        id: login
        with:
          user: NickStrupat
      # Pushing the .nupkg also pushes the .snupkg beside it.
      - run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
