name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # x64 on Linux and Windows, arm64 on macOS. The codegen tests read arm64 mnemonics only, so their instruction
    # half skips on x64 and runs on macOS; the monitor half and the NativeAOT leg run everywhere, using each
    # runner's own native toolchain.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      # Release: the codegen tests read optimised code, and skip on a Debug build.
      - run: dotnet test -c Release --no-build
      # Coyote explores the cells' interleavings itself, so this result does not depend on the runner's
      # cores. The build already rewrote its copies of the assemblies.
      - run: dotnet run --project CoyoteTests -c Release --no-build
      - run: dotnet pack Atomic -c Release --no-build -o artifacts
        if: matrix.os == 'ubuntu-latest'
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: artifacts/
